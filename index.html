<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>派对策划器 · OpenRouter 版</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at top, #fdf2ff, #f5f5f7);
      padding: 24px;
    }

    .app {
      width: 100%;
      max-width: 960px;
      background: #ffffff;
      border-radius: 24px;
      box-shadow: 0 20px 40px rgba(15, 23, 42, 0.12);
      padding: 24px 24px 28px;
      display: grid;
      grid-template-columns: minmax(0, 1.1fr) minmax(0, 1.4fr);
      gap: 24px;
    }

    @media (max-width: 768px) {
      .app {
        grid-template-columns: 1fr;
        padding: 20px;
      }
    }

    .app-header {
      grid-column: 1 / -1;
      margin-bottom: 4px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .app-title {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 0.04em;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .app-badge {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 999px;
      background: #eef2ff;
      color: #4f46e5;
      font-weight: 600;
    }

    .app-subtitle {
      font-size: 12px;
      color: #9ca3af;
    }

    .tagline {
      font-size: 11px;
      color: #9ca3af;
      margin-top: 6px;
    }

    .form-card {
      border-radius: 18px;
      padding: 18px 18px 20px;
      background: linear-gradient(135deg, #f9fafb, #eef2ff);
      border: 1px solid rgba(148, 163, 184, 0.35);
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-label {
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
      color: #4b5563;
    }

    .form-label span.helper {
      font-weight: 400;
      font-size: 11px;
      color: #9ca3af;
    }

    input[type="text"],
    input[type="number"],
    input[type="datetime-local"] {
      width: 100%;
      padding: 9px 10px;
      border-radius: 11px;
      border: 1px solid #d1d5db;
      font-size: 14px;
      outline: none;
      background-color: rgba(255, 255, 255, 0.9);
      transition: border-color 0.18s ease, box-shadow 0.18s ease, background-color 0.18s ease;
    }

    input[type="text"]:focus,
    input[type="number"]:focus,
    input[type="datetime-local"]:focus {
      border-color: #6366f1;
      box-shadow: 0 0 0 1px rgba(99, 102, 241, 0.25);
      background-color: #ffffff;
    }

    .form-row {
      display: flex;
      gap: 10px;
    }

    .form-row > .form-group {
      flex: 1;
      margin-bottom: 0;
    }

    .btn-row {
      margin-top: 12px;
      display: flex;
      gap: 10px;
      align-items: center;
    }

    button {
      border: none;
      border-radius: 999px;
      padding: 9px 16px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: transform 0.12s ease, box-shadow 0.12s ease, background 0.12s ease, opacity 0.12s ease;
      white-space: nowrap;
    }

    .btn-primary {
      background: linear-gradient(135deg, #4f46e5, #6366f1);
      color: #ffffff;
      box-shadow: 0 8px 16px rgba(79, 70, 229, 0.35);
    }

    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 10px 18px rgba(79, 70, 229, 0.4);
    }

    .btn-secondary {
      background: #f3f4f6;
      color: #4b5563;
    }

    .btn-secondary:hover {
      background: #e5e7eb;
    }

    .btn-disabled {
      opacity: 0.5;
      cursor: not-allowed;
      box-shadow: none;
      transform: none;
    }

    .hint {
      font-size: 11px;
      color: #9ca3af;
      margin-top: 6px;
    }

    .result-card {
      border-radius: 18px;
      padding: 18px 18px 20px;
      background: #0f172a;
      color: #e5e7eb;
      position: relative;
      overflow: hidden;
    }

    .result-card::before {
      content: "";
      position: absolute;
      inset: -40%;
      background: radial-gradient(circle at 0% 0%, rgba(248, 250, 252, 0.08), transparent 55%);
      opacity: 0.8;
      pointer-events: none;
    }

    .result-header {
      position: relative;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      gap: 8px;
      align-items: flex-start;
    }

    .result-title {
      font-size: 18px;
      font-weight: 700;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .result-meta {
      font-size: 12px;
      color: #9ca3af;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .pill {
      padding: 2px 8px;
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(148, 163, 184, 0.4);
      font-size: 11px;
    }

    .result-body {
      position: relative;
      display: grid;
      grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr);
      gap: 14px;
      margin-top: 6px;
    }

    @media (max-width: 768px) {
      .result-body {
        grid-template-columns: 1fr;
      }
    }

    .section-title {
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
      color: #e5e7eb;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .section-title small {
      font-size: 11px;
      font-weight: 400;
      color: #9ca3af;
    }

    ul.timeline {
      list-style: none;
      border-left: 1px solid rgba(148, 163, 184, 0.6);
      padding-left: 12px;
      margin-left: 3px;
      font-size: 13px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    ul.timeline li {
      position: relative;
      padding-left: 8px;
    }

    ul.timeline li::before {
      content: "";
      position: absolute;
      left: -13px;
      top: 6px;
      width: 7px;
      height: 7px;
      border-radius: 999px;
      background: #6366f1;
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.4);
    }

    .time-tag {
      font-size: 11px;
      color: #a5b4fc;
      margin-right: 4px;
      font-variant-numeric: tabular-nums;
    }

    ul.checklist {
      list-style: none;
      font-size: 13px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    ul.checklist li {
      display: flex;
      align-items: flex-start;
      gap: 6px;
    }

    ul.checklist span.box {
      margin-top: 1px;
      width: 12px;
      height: 12px;
      border-radius: 4px;
      border: 1px solid rgba(148, 163, 184, 0.9);
      flex-shrink: 0;
    }

    .tips {
      margin-top: 8px;
      font-size: 12px;
      color: #9ca3af;
    }

    .empty-state {
      font-size: 13px;
      color: #9ca3af;
      text-align: center;
      padding: 28px 8px;
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="app-header">
      <div>
        <div class="app-title">
          派对策划器
          <span class="app-badge">OpenRouter · Sherlock Dash Alpha</span>
        </div>
        <p class="tagline">输入主题、时间、人数，一键生成派对规划，再用「换一个」尝试不同风格 ✨</p>
      </div>
      <div class="app-subtitle">
        前后端分离 · LLM 实时生成
      </div>
    </header>

    <!-- 左侧表单 -->
    <section class="form-card">
      <div class="form-group">
        <label class="form-label">
          派对主题
          <span class="helper">例如：奶酪火锅局 / 万圣节 / 桌游之夜</span>
        </label>
        <input id="themeInput" type="text" placeholder="输入派对主题..." />
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label">
            开始时间
            <span class="helper">用于生成时间轴，可以不填</span>
          </label>
          <input id="timeInput" type="datetime-local" />
        </div>
        <div class="form-group">
          <label class="form-label">
            人数预估
            <span class="helper">大概人数即可</span>
          </label>
          <input id="peopleInput" type="number" min="1" max="100" placeholder="10" />
        </div>
      </div>

      <div class="btn-row">
        <button id="generateBtn" class="btn-primary">
          <span>生成规划</span> <span>🎉</span>
        </button>
        <button id="shuffleBtn" class="btn-secondary btn-disabled" disabled>
          <span>换一个</span> <span>🔁</span>
        </button>
      </div>

      <p class="hint">
        小提示：主题可以直接写“生日”“公司团建”“烧烤”等，我会自动帮你补充气氛和活动。
      </p>
    </section>

    <!-- 右侧结果 -->
    <section class="result-card">
      <div id="resultContainer">
        <div class="empty-state">
          👋 先在左侧填写信息，然后点击「生成规划」。<br />
          LLM 会根据你的主题实时生成时间轴与物品清单。
        </div>
      </div>
    </section>
  </div>

  <script>
    const themeInput = document.getElementById("themeInput");
    const timeInput = document.getElementById("timeInput");
    const peopleInput = document.getElementById("peopleInput");
    const generateBtn = document.getElementById("generateBtn");
    const shuffleBtn = document.getElementById("shuffleBtn");
    const resultContainer = document.getElementById("resultContainer");

    let currentVariant = 0;
    let lastPayload = null;

    function setLoading(isLoading) {
      if (isLoading) {
        generateBtn.classList.add("btn-disabled");
        generateBtn.disabled = true;
        generateBtn.innerHTML = "<span>生成中...</span> ⏳";
      } else {
        generateBtn.classList.remove("btn-disabled");
        generateBtn.disabled = false;
        generateBtn.innerHTML = "<span>生成规划</span> 🎉";
      }
    }

    function renderPlan(plan) {
      if (!plan) return;
      const html = `
        <div class="result-header">
          <div class="result-title">
            <span>${plan.title || "派对规划"}</span>
            <div class="result-meta">
              <span class="pill">氛围：${plan.vibe || "轻松随意"}</span>
              <span class="pill">时长：${plan.durationText || "约 3 小时"}</span>
              <span class="pill">人数：${plan.peopleText || "人数待定"}</span>
            </div>
          </div>
        </div>
        <div class="result-body">
          <div>
            <div class="section-title">
              行程时间轴
              <small>由 LLM 实时生成，可按现场微调</small>
            </div>
            <ul class="timeline">
              ${(plan.timeline || [])
                .map(
                  (item) => `
                <li>
                  <span class="time-tag">${item.time}</span>
                  <span>${item.label}：${item.detail}</span>
                </li>`
                )
                .join("")}
            </ul>
          </div>
          <div>
            <div class="section-title">
              所需物品清单
              <small>按预算删减或升级</small>
            </div>
            <ul class="checklist">
              ${(plan.items || [])
                .map(
                  (text) => `
                <li>
                  <span class="box"></span>
                  <span>${text}</span>
                </li>`
                )
                .join("")}
            </ul>
            <div class="tips">💡 小建议：${plan.tips || "提前确定 1 位总负责人和 1 位设备负责人，可以避免现场混乱。"}</div>
          </div>
        </div>
      `;
      resultContainer.innerHTML = html;
    }

    async function callBackend({ theme, startTime, people, variantIndex }) {
      setLoading(true);
      try {
        const res = await fetch("/api/party-plan", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ theme, startTime, people, variantIndex }),
        });

        if (!res.ok) {
          const text = await res.text();
          console.error("Backend error:", text);
          resultContainer.innerHTML = `
            <div class="empty-state">
              😥 生成失败了（${res.status}）。<br/>
              稍后再试试。如果是刚部署，确认 Cloudflare 上已经设置了 GEMINI_API_KEY。
            </div>
          `;
          return;
        }

        const plan = await res.json();
        renderPlan(plan);
        shuffleBtn.disabled = false;
        shuffleBtn.classList.remove("btn-disabled");
      } catch (e) {
        console.error(e);
        resultContainer.innerHTML = `
          <div class="empty-state">
            🔌 网络或服务器异常，稍后再试试。<br/>
            可能是网络问题，或者服务暂时不可用。
          </div>
        `;
      } finally {
        setLoading(false);
      }
    }

    function generatePlan() {
      const theme = themeInput.value.trim() || "主题派对";
      const timeValue = timeInput.value || null;
      const peopleValue = peopleInput.value ? parseInt(peopleInput.value, 10) : null;

      currentVariant = 0;
      lastPayload = { theme, startTime: timeValue, people: peopleValue };
      callBackend({ ...lastPayload, variantIndex: currentVariant });
    }

    function shufflePlan() {
      if (!lastPayload) return;
      currentVariant = (currentVariant + 1) % 3; // 0-1-2 循环
      callBackend({ ...lastPayload, variantIndex: currentVariant });
    }

    generateBtn.addEventListener("click", generatePlan);
    shuffleBtn.addEventListener("click", shufflePlan);

    [themeInput, timeInput, peopleInput].forEach((el) => {
      el.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          e.preventDefault();
          generatePlan();
        }
      });
    });
  </script>
</body>
</html>
